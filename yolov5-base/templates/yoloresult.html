<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>图片识别</title>
</head>
<style>
   h1{
        color:#9dacdf;
    }
    .box{
		min-width: 420px;
        width:70%;
        height:70%;
        margin: auto;
        overflow:hidden;
/*        display: flex;
        flex-wrap: nowrap; */

    }
    .box .inbox{
		min-width: 200px;
        width:88%;
        height:450px;
        margin: 4%;
        border: 2px solid #ccc;
        border-radius: 16px;
    }
	#right_box,#left_box{
/* 		width: 400px;
		height: 320px; */
		float: left;

	}
	#main_box{
/* 		width: 420px;
		height:700px; */

	}
</style>
<body>
    <h1 align="center">图片识别</h1>
        <form enctype = 'multipart/form-data' method = 'POST'>
            <div class="box" id="main_box">
                <div class="inbox" align="center" id="left_box">
                    <i>上传图片</i>

                    <input type="hidden" name = "original_pic" id="org" onchange="showImg()"/>
                    <hr>
                    <img src="{{url_for('static',filename='./images/'+filename)}}" alt='' id='img_id' style='width:100%'  alt="你的图片被外星人劫持了~~">
                </div>

                <div class="inbox" align="center" id="right_box">
                    <i>识别结果</i>
                    <input type="hidden"  id="con" onchange="showImg2()",/>
                    <hr>
                    <img src="{{url_for('static',filename=result)}}" alt='' id='img_id2' style='width:100%' >
                </div>
            </div>


            <div>
                <i>物种及病种：</i>
            <label>{{type}}</label>
            </div>
            <div>
                 <i>病种数量：</i>
            <label>{{num}}</label>
            </div>
            <div>
                 <i>用时(秒)：</i>
            <label>{{t}}</label>
            </div>
        </form>


</body>
<script>
    function showImg(){
        var file = document.getElementById('org').files[0];
        var re = new FileReader();
        re.readAsDataURL(file);
        re.onload = function(re){
            document.getElementById('img_id').src=re.target.result;
        }
    }
    function showImg2(){
        var file = document.getElementById('con').files[0];
        var re = new FileReader();
        re.readAsDataURL(file);
        re.onload = function(re){
            document.getElementById('img_id2').src=re.target.result;
        }
    }
</script>
</html>
